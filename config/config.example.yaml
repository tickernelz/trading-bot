mode: dry_run
capital:
  initial_idr: 2000000
  compounding: true
risk:
  max_daily_loss_pct: 1.0
  max_total_drawdown_pct: 10.0
  risk_per_trade_pct: 0.5
  max_open_trades: 3
  leverage: none
  on_breach: stop_new_entries
  daily_reset_timezone: Asia/Jakarta
exchange:
  name: indodax
  pairs: [BTC/IDR, ETH/IDR, SOL/IDR]
  timeframe: 1h
  fee_pct: 0.2
providers:
  - id: nutaraline
    type: openai-completions
    base_url: https://nutaraline.co.uk/v1
    api_key_env: NUTARALINE_API_KEY
    api_key: null
    models: [deepseek-v4.1-flash-1017]
  - id: modelrouter
    type: openai-completions
    base_url: https://modelrouter.id/v1
    api_key_env: MODELROUTER_API_KEY
    api_key: null
    models: [glm-5.3-flash:mr]
  - id: xai-hm
    type: openai-responses
    base_url: https://gateway.example.com/v1
    api_key_env: XAI_HM_API_KEY
    api_key: null
    models: [cx/gpt-6-luna]
  - id: sub2api-claude
    type: anthropic-messages
    base_url: http://localhost:62173
    api_key_env: SUB2API_CLAUDE_API_KEY
    api_key: null
    models: [claude-haiku-5-5]
  - id: omniroute
    type: openai-completions
    base_url: http://localhost:20128/v1
    api_key_env: OMNIROUTE_API_KEY
    api_key: null
    models: [agy/gemini-3.8-flash-medium]
  - id: experientiallabs
    type: openai-completions
    base_url: https://api.experientiallabs.ai/v1
    api_key_env: EXPERIENTIALLABS_API_KEY
    api_key: null
    models: [llama-4-maverick]
  - id: sub2api-agy
    type: openai-completions
    base_url: http://localhost:62173/v1
    api_key_env: SUB2API_AGY_API_KEY
    api_key: null
    models: [gpt-oss-120b-medium]
  - id: experientiallabs-systemone
    type: systemone
    base_url: https://api.experientiallabs.ai
    api_key_env: EXPERIENTIALLABS_API_KEY
    api_key: null
    models: [jev-latest, clef, clef-flash]
  - id: experientiallabs-decisions
    type: openai-decisions
    base_url: https://api.experientiallabs.ai
    api_key_env: EXPERIENTIALLABS_API_KEY
    api_key: null
    models: [gpt-6-luna-decisions]
swarm:
  enabled: true
  mode: shadow
  shuffle_options: true
  min_voters_answered: 5
  max_spread: null
  voters:
    - id: v1
      adapter: llm_structured
      provider: nutaraline
      model: deepseek-v4.1-flash-1017
      variation: option_order
      timeout_s: 30
      weight: 1.0
      enabled: true
    - id: v2
      adapter: llm_structured
      provider: modelrouter
      model: glm-5.3-flash:mr
      variation: option_order
      timeout_s: 30
      weight: 1.0
      enabled: true
    - id: v3
      adapter: llm_structured
      provider: xai-hm
      model: cx/gpt-6-luna
      variation: option_order
      timeout_s: 30
      weight: 1.0
      enabled: true
    - id: v4
      adapter: llm_structured
      provider: sub2api-claude
      model: claude-haiku-5-5
      variation: option_order
      timeout_s: 30
      weight: 1.0
      enabled: true
    - id: v5
      adapter: llm_structured
      provider: omniroute
      model: agy/gemini-3.8-flash-medium
      variation: option_order
      timeout_s: 30
      weight: 1.0
      enabled: true
    - id: v6
      adapter: llm_structured
      provider: experientiallabs
      model: llama-4-maverick
      variation: option_order
      timeout_s: 30
      weight: 1.0
      enabled: true
    - id: v7
      adapter: llm_structured
      provider: sub2api-agy
      model: gpt-oss-120b-medium
      variation: option_order
      timeout_s: 30
      weight: 1.0
      enabled: true
    - id: d1
      adapter: systemone
      provider: experientiallabs-systemone
      model: jev-latest
      variation: option_order
      timeout_s: 30
      weight: 1.0
      enabled: false
    - id: d2
      adapter: systemone
      provider: experientiallabs-systemone
      model: clef-flash
      variation: option_order
      timeout_s: 30
      weight: 1.0
      enabled: false
    - id: d3
      adapter: openai_decisions
      provider: experientiallabs-decisions
      model: gpt-6-luna-decisions
      variation: option_order
      timeout_s: 30
      weight: 1.0
      enabled: false
llm:
  backend: deepagents
  analyst_model: nutaraline:deepseek-v4.1-flash-1017
compute:
  max_cost_idr_per_day: off
  on_exceed: skip_new_entries
  log_cost: true
data:
  news_rss: [coindesk, cointelegraph]
  fear_greed: true
  social: off
notify:
  web_push: true
  telegram:
    enabled: false
    token_env: TELEGRAM_BOT_TOKEN
    chat_id: null
    authorized_users: []
api:
  listen: 127.0.0.1
  port: 8080
  username_env: FT_API_USERNAME
  password_env: FT_API_PASSWORD
  jwt_secret_env: FT_API_JWT_SECRET
  force_entry: false
shadow:
  listen: 127.0.0.1
  port: 8091
  database: swarm_decisions.sqlite
  token_env: SHADOW_TOKEN
analyst:
  listen: 127.0.0.1
  port: 8092
  token_env: ANALYST_TOKEN
  data_dir: analyst_data
  reports_dir: analyst_reports
  language: en
  report_at: "00:10"
analytics:
  scoreboard:
    enabled: true
    auto_disable: true
    min_samples: 30
    max_ece: 0.25
    brier_margin: 0.05
    accuracy_margin: 0.05
    bins: 5
    interval_s: 3600
  stress:
    drop_pct: 10.0
  tax:
    pph22_final_pct: 0.21
  portfolio:
    max_pair_share_pct: 50.0
