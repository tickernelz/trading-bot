name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version label for a manual build, which publishes nothing
        default: 0.0.0-manual
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  panel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - run: npm ci --include=dev
        working-directory: pwa
      - run: npm test
        working-directory: pwa
      - run: npm run build
        working-directory: pwa
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: panel
          path: pwa/dist
          if-no-files-found: error

  bundle:
    needs: panel
    name: bundle (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-24.04
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: win-x64
            os: windows-latest
          - target: win-arm64
            os: windows-11-arm
            skip: pyarrow
            from_source: cryptography,python-rapidjson
          - target: mac-x64
            os: macos-15-intel
            from_source: cryptography
          - target: mac-arm64
            os: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: panel
          path: pwa/dist
      - name: Version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="$VERSION_INPUT"; fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then echo "not a version: $v" >&2; exit 1; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
      - name: OpenSSL for Windows on ARM
        if: matrix.target == 'win-arm64'
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg.exe" install openssl:arm64-windows-static-md
          echo "OPENSSL_DIR=$VCPKG_INSTALLATION_ROOT/installed/arm64-windows-static-md" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"
      - name: OpenSSL for macOS on Intel
        if: matrix.target == 'mac-x64'
        run: |
          brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"
      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: >
          uv run --python 3.13 --no-project packaging/build.py
          --target ${{ matrix.target }}
          --version "$VERSION"
          --commit ${{ github.sha }}
          --skip "${{ matrix.skip }}"
          --from-source "${{ matrix.from_source }}"
          --wheelhouse wheelhouse
      - name: Unpack the archive and smoke test it
        env:
          SMOKE_REQUIRE_ENGINE: ${{ github.ref_type == 'tag' && '1' || '0' }}
        run: |
          mkdir unpacked
          cd build/${{ matrix.target }}/out
          case "${{ matrix.target }}" in
            win-*) uv run --python 3.13 --no-project python -m zipfile -e trading-bot-*.zip ../../../unpacked ;;
            *) tar -xzf trading-bot-*.tar.gz -C ../../../unpacked ;;
          esac
          cd ../../..
          exe=$(find unpacked -maxdepth 2 -type f \( -name trading-bot -o -name trading-bot.exe \) | head -n 1)
          echo "smoke: $exe"
          uv run --python 3.13 --no-project scripts/smoke.py --timeout 300 --engine-wait 240 -- "$exe" 2>&1 | tee smoke.log
          grep -q "^RESULT:" smoke.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.target }}
          path: build/${{ matrix.target }}/out/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-${{ matrix.target }}
          path: smoke.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.from_source != ''
        with:
          name: wheelhouse-${{ matrix.target }}
          path: wheelhouse
          if-no-files-found: warn

  release:
    needs: bundle
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && (contains(github.ref_name, '-rc') || needs.bundle.result == 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: smoke-*
          path: smoke
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          cd artifacts
          ls -l
          results=$(for d in ../smoke/smoke-*; do echo "- ${d##*/smoke-}: $(grep '^RESULT:' "$d/smoke.log" | head -n 1)"; done)
          cat trading-bot-*.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS
          flags=()
          if [[ "${GITHUB_REF_NAME}" =~ -rc(\.[0-9]+)?$ ]]; then flags+=(--prerelease); fi
          {
            echo "Native builds of the dry-run trading bot. No code signing: see the first-open steps in the README."
            echo
            echo "Checksums are in SHA256SUMS. Source: https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_REF_NAME}"
            echo
            echo "Targets built and smoke tested in this release:"
            for f in trading-bot-*.sha256; do echo "- ${f%.sha256}"; done
            echo
            echo "Smoke test of each unpacked archive on its native runner:"
            echo "$results"
          } > notes.md
          files=(trading-bot-*.tar.gz trading-bot-*.zip SHA256SUMS)
          gh release create "${GITHUB_REF_NAME}" "${flags[@]}" --title "${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag "${files[@]}"
