[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-bot-swarm"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "deepagents==0.7.32",
  "langchain-openai>=1.7",
  "langchain-anthropic>=1.0",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
include = ["tb_swarm*"]
